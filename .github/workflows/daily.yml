name: daily-science
on:
  schedule:
    - cron: "0 23 * * *"   # 매일 한국시간 08:00
  workflow_dispatch:
concurrency:
  group: daily-science
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 daily_science.py
      - run: python3 site/make_site.py
      - name: Commit results
        run: |
          git config user.name "daily-science-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports site/public
          git diff --cached --quiet || git commit -m "리포트 $(date +%F)"
          git push
